<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550"><rect width="1200" height="550" fill="#f4eee1"/><g font-family="Arial, sans-serif"><text x="40" y="90" font-size="43" fill="#274b43">Перед покупкой</text><rect x="40" y="160" width="340" height="310" rx="22" fill="#e8ddc6"/><text x="210" y="235" text-anchor="middle" font-size="40" fill="#274b43">Состав</text><text x="210" y="330" text-anchor="middle" font-size="32" fill="#274b43">Что входит</text><text x="210" y="385" text-anchor="middle" font-size="32" fill="#274b43">в изделие</text><rect x="430" y="160" width="340" height="310" rx="22" fill="#d8e4dd"/><text x="600" y="235" text-anchor="middle" font-size="40" fill="#274b43">Масса</text><text x="600" y="330" text-anchor="middle" font-size="32" fill="#274b43">Какой размер</text><text x="600" y="385" text-anchor="middle" font-size="32" fill="#274b43">вам нужен</text><rect x="820" y="160" width="340" height="310" rx="22" fill="#e8ddc6"/><text x="990" y="235" text-anchor="middle" font-size="40" fill="#274b43">Хранение</text><text x="990" y="330" text-anchor="middle" font-size="32" fill="#274b43">Когда и как</text><text x="990" y="385" text-anchor="middle" font-size="32" fill="#274b43">съедите покупку</text></g></svg>