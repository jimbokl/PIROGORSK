<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550"><rect width="1200" height="550" fill="#f4eee1"/><g font-family="Arial, sans-serif"><text x="40" y="90" font-size="43" fill="#274b43">Планируем рыбную покупку</text><rect x="40" y="160" width="340" height="310" rx="22" fill="#e8ddc6"/><text x="210" y="235" text-anchor="middle" font-size="40" fill="#274b43">Когда</text><text x="210" y="330" text-anchor="middle" font-size="32" fill="#274b43">Ужин или</text><text x="210" y="385" text-anchor="middle" font-size="32" fill="#274b43">подарок</text><rect x="430" y="160" width="340" height="310" rx="22" fill="#d8e4dd"/><text x="600" y="235" text-anchor="middle" font-size="40" fill="#274b43">Что</text><text x="600" y="330" text-anchor="middle" font-size="32" fill="#274b43">Вид рыбы</text><text x="600" y="385" text-anchor="middle" font-size="32" fill="#274b43">и обработка</text><rect x="820" y="160" width="340" height="310" rx="22" fill="#e8ddc6"/><text x="990" y="235" text-anchor="middle" font-size="40" fill="#274b43">Как</text><text x="990" y="330" text-anchor="middle" font-size="32" fill="#274b43">Условия</text><text x="990" y="385" text-anchor="middle" font-size="32" fill="#274b43">хранения</text></g></svg>