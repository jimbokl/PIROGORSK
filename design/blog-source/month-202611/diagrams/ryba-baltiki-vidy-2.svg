<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550"><rect width="1200" height="550" rx="24" fill="#fcfaf5"/><g font-family="Arial,sans-serif"><text x="40" y="90" font-size="42" fill="#162b44">Что спросить перед покупкой</text><rect x="40" y="160" width="340" height="310" rx="24" fill="#f6e9cc"/><circle cx="210" cy="220" r="24" fill="#c78b32"/><text x="210" y="229" text-anchor="middle" font-size="24" fill="white">1</text><text x="210" y="325" text-anchor="middle" font-size="44" fill="#162b44">Название</text><text x="210" y="386" text-anchor="middle" font-size="44" fill="#162b44">вида</text><rect x="430" y="160" width="340" height="310" rx="24" fill="#dcece7"/><circle cx="600" cy="220" r="24" fill="#c78b32"/><text x="600" y="229" text-anchor="middle" font-size="24" fill="white">2</text><text x="600" y="325" text-anchor="middle" font-size="44" fill="#162b44">Способ</text><text x="600" y="386" text-anchor="middle" font-size="44" fill="#162b44">обработки</text><rect x="820" y="160" width="340" height="310" rx="24" fill="#e8e8f4"/><circle cx="990" cy="220" r="24" fill="#c78b32"/><text x="990" y="229" text-anchor="middle" font-size="24" fill="white">3</text><text x="990" y="325" text-anchor="middle" font-size="44" fill="#162b44">Хранение</text><text x="990" y="386" text-anchor="middle" font-size="44" fill="#162b44">и дорога</text></g></svg>