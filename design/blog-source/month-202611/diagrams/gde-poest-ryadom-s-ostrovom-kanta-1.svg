<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900"><rect width="1000" height="900" rx="32" fill="#fbf8f2"/><g font-family="Arial,sans-serif"><text x="40" y="88" font-size="50" fill="#15273d">Стол рядом с прогулкой</text><rect x="40" y="150" width="920" height="210" rx="26" fill="#f3e3c8"/><circle cx="98" cy="214" r="27" fill="#a46b27"/><text x="98" y="224" text-anchor="middle" font-size="30" fill="#fff">1</text><text x="160" y="220" font-size="48" fill="#15273d">Маршрут</text><text x="160" y="278" font-size="42" fill="#40536c">Сторона реки</text><text x="160" y="327" font-size="42" fill="#40536c">и следующий пункт</text><rect x="40" y="390" width="920" height="210" rx="26" fill="#e0e9e5"/><circle cx="98" cy="454" r="27" fill="#a46b27"/><text x="98" y="464" text-anchor="middle" font-size="30" fill="#fff">2</text><text x="160" y="460" font-size="48" fill="#15273d">Формат</text><text x="160" y="518" font-size="42" fill="#40536c">Кофе или обед</text><text x="160" y="567" font-size="42" fill="#40536c">для всей компании</text><rect x="40" y="630" width="920" height="210" rx="26" fill="#e6eaf0"/><circle cx="98" cy="694" r="27" fill="#a46b27"/><text x="98" y="704" text-anchor="middle" font-size="30" fill="#fff">3</text><text x="160" y="700" font-size="48" fill="#15273d">Условия</text><text x="160" y="758" font-size="42" fill="#40536c">Время кухни</text><text x="160" y="807" font-size="42" fill="#40536c">и удобный вход</text></g></svg>