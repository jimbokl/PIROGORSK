<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><rect width="1200" height="520" fill="#f6efe2"/><g font-family="Arial, sans-serif" fill="#244545"><text x="44" y="108" font-size="57" font-weight="700">Как распределить работу</text><rect x="44" y="162" width="360" height="300" rx="22" fill="#ebdfca"/><text x="224" y="247" text-anchor="middle" font-size="48" font-weight="700">Накануне</text><text x="224" y="330" text-anchor="middle" font-size="43">Сверить меню</text><text x="224" y="394" text-anchor="middle" font-size="43">и посуду</text><rect x="418" y="162" width="360" height="300" rx="22" fill="#d9e6df"/><text x="598" y="247" text-anchor="middle" font-size="48" font-weight="700">В день</text><text x="598" y="330" text-anchor="middle" font-size="43">Распределить</text><text x="598" y="394" text-anchor="middle" font-size="43">время выпечки</text><rect x="792" y="162" width="360" height="300" rx="22" fill="#ebdfca"/><text x="972" y="247" text-anchor="middle" font-size="48" font-weight="700">Перед подачей</text><text x="972" y="330" text-anchor="middle" font-size="43">Нарезать</text><text x="972" y="394" text-anchor="middle" font-size="43">и подписать</text></g></svg>
