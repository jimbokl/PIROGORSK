<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="530"><rect width="1200" height="530" rx="32" fill="#fbf8f2"/><g font-family="Arial,sans-serif"><text x="40" y="88" font-size="42" fill="#15273d">За одним столом</text><rect x="40" y="150" width="340" height="310" rx="26" fill="#f3e3c8"/><circle cx="210" cy="210" r="20" fill="#c28a3c"/><text x="210" y="218" text-anchor="middle" font-size="23" fill="#fff">1</text><text x="210" y="280" text-anchor="middle" font-size="36" fill="#15273d">Ребёнку</text><text x="210" y="350" text-anchor="middle" font-size="30" fill="#40536c">Понятное</text><text x="210" y="397" text-anchor="middle" font-size="30" fill="#40536c">по составу</text><rect x="430" y="150" width="340" height="310" rx="26" fill="#e0e9e5"/><circle cx="600" cy="210" r="20" fill="#c28a3c"/><text x="600" y="218" text-anchor="middle" font-size="23" fill="#fff">2</text><text x="600" y="280" text-anchor="middle" font-size="36" fill="#15273d">Взрослым</text><text x="600" y="350" text-anchor="middle" font-size="30" fill="#40536c">То, что</text><text x="600" y="397" text-anchor="middle" font-size="30" fill="#40536c">хочется</text><rect x="820" y="150" width="340" height="310" rx="26" fill="#e6eaf0"/><circle cx="990" cy="210" r="20" fill="#c28a3c"/><text x="990" y="218" text-anchor="middle" font-size="23" fill="#fff">3</text><text x="990" y="280" text-anchor="middle" font-size="36" fill="#15273d">Всем</text><text x="990" y="350" text-anchor="middle" font-size="30" fill="#40536c">Удобный</text><text x="990" y="397" text-anchor="middle" font-size="30" fill="#40536c">ритм обеда</text></g></svg>