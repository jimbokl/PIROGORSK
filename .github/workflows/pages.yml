name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Restore processed Astro images
        id: astro-images
        uses: actions/cache/restore@v4
        with:
          path: node_modules/.astro/assets
          key: ${{ runner.os }}-astro-images-v1-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-astro-images-v1-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
      - run: npm run build
      - name: Save processed Astro images
        if: steps.astro-images.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: node_modules/.astro/assets
          key: ${{ steps.astro-images.outputs.cache-primary-key }}
      - run: node scripts/verify-seo.mjs
      - run: node scripts/verify-expansion.mjs
      - run: node scripts/verify-seo-map.mjs
      - run: node scripts/verify-city-pages.mjs
      - run: node scripts/verify-article-artwork.mjs
      - run: node scripts/verify-content-month.mjs
      - run: node scripts/verify-content-priority.mjs
      - run: node scripts/verify-product-pages.mjs
      - run: node scripts/verify-product-backdrops.mjs
      - run: npm test
      - run: npm run test:worker
      - run: npm run test:browser
      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: worker/dist/qa-formats/
          if-no-files-found: ignore
      - run: node scripts/verify-site-polish.mjs
      - run: node scripts/verify-journal-reading.mjs
      - run: node scripts/verify-bundle-pages.mjs
      - run: node scripts/verify-picnic-set.mjs
      - run: node scripts/verify-catalog-polish.mjs
      - run: node scripts/verify-pie-cutaways.mjs
      - run: node scripts/verify-control-names.mjs
      - name: Check deployed Worker against Pages artifact
        run: node scripts/verify-release.mjs check
      - run: node scripts/indexnow.mjs manifest
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
      - name: Verify published Pages and Worker compatibility
        run: node scripts/verify-release.mjs published https://pirogorsk.ru/
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: indexnow-v1-
      - name: Notify IndexNow after publication
        id: indexnow
        run: node scripts/indexnow.mjs submit
      - uses: actions/cache/save@v4
        if: steps.indexnow.outcome == 'success'
        with:
          path: .indexnow/state.json
          key: indexnow-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexnow-report
          path: .indexnow/report.json
          if-no-files-found: ignore
